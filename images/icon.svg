<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Virga</title>
  <!-- Virga: streaks of rain that fade away before they reach the ground. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2c42"/>
      <stop offset="1" stop-color="#101824"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="14" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6e4ff"/>
      <stop offset="0.45" stop-color="#5bb6f0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2f78c4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#sky)"/>
  <g stroke="url(#fall)" stroke-linecap="round" fill="none">
    <line x1="22" y1="22" x2="42.5" y2="86" stroke-width="6"/>
    <line x1="40" y1="14" x2="66.9" y2="98" stroke-width="7"/>
    <line x1="60" y1="26" x2="77.9" y2="82" stroke-width="6"/>
    <line x1="78" y1="16" x2="102.3" y2="92" stroke-width="7"/>
    <line x1="97" y1="30" x2="109.8" y2="70" stroke-width="5"/>
  </g>
  <line x1="28" y1="112" x2="100" y2="112" stroke="#5bb6f0" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
</svg>
